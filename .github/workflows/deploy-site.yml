# Builds the documentation site in site/ and deploys it to GitHub Pages.
# Based on the official Astro workflow: https://docs.astro.build/en/guides/deploy/github/
# Actions are pinned to full commit SHAs (version in the trailing comment), as GitHub's
# secure use guide recommends: https://docs.github.com/en/actions/reference/security/secure-use
# Repository setting needed once: Settings, Pages, Build and deployment, Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# No permissions by default; each job asks only for what it needs.
permissions: {}

# One deployment at a time; a running production deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, build and upload the site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
