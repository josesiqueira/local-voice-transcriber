  <text x="80" y="300" font-family="IBM Plex Sans OG" font-weight="600" font-size="76" letter-spacing="-1.5" fill="#ffffff">Local Voice Transcriber</text>
  <text x="80" y="368" font-family="IBM Plex Sans OG" font-size="34" fill="#cbc6c4">Transcribe WhatsApp Web voice notes on your own computer.</text>
  <text x="80" y="414" font-family="IBM Plex Sans OG" font-size="34" fill="#cbc6c4">Whisper large-v3-turbo on your GPU or CPU. No audio leaves it.</text>
